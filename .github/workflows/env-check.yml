name: Env install check

permissions:
  contents: write

on:
  pull_request:
  push:
    branches: [ main, master ]

jobs:
  windows-install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install repo requirements
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) {
            python -m pip install -r requirements.txt
          }
          if (Test-Path s4g_image_downloader/requirements.txt) {
            python -m pip install -r s4g_image_downloader/requirements.txt
          }
      - name: Smoke test
        shell: pwsh
        run: |
          python - <<'PY'
          print('env install: OK')
          PY
      - name: Generate requirements-locked.txt
        shell: pwsh
        run: |
          python -m pip freeze > requirements-locked.txt
      - name: Commit and push lockfile if changed
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements-locked.txt || Exit 0
          $status = git status --porcelain
          if ($status) {
            git commit -m "chore: update requirements-locked.txt (generated by CI)" || Exit 0
            git push
          } else {
            Write-Host "No changes to requirements-locked.txt"
          }
